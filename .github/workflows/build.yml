name: Build EvoNet Installer (Electron + Python)

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Cache pip packages
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: pip-${{ runner.os }}-

      # 4️⃣ Install Python dependencies
      - name: Install Python dependencies
        run: pip install numpy pillow scipy pyinstaller

      # 5️⃣ Build EXE
      # NOTE: ga_best_weights.npy, pca_mean.npy, pca_components.npy must be
      # committed to the repo (they are generated by train.py and are ~100 KB total).
      - name: Build Python EXE
        shell: pwsh
        run: |
          cd EvoNet/src/model
          python -m PyInstaller --onefile `
            --add-data "ga_best_weights.npy;." `
            --add-data "pca_mean.npy;." `
            --add-data "pca_components.npy;." `
            --exclude-module torch `
            --exclude-module torchvision `
            --exclude-module torchaudio `
            --exclude-module pandas `
            --exclude-module sklearn `
            --exclude-module tensorflow `
            predict.py

      # 6️⃣ Copy EXE + fitness history into resources/model
      # fitness_history.npy is read at runtime by index.js (stats page chart).
      - name: Prepare resources folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path EvoNet\resources\model
          Copy-Item EvoNet\src\model\dist\predict.exe      EvoNet\resources\model\predict.exe
          Copy-Item EvoNet\src\model\fitness_history.npy   EvoNet\resources\model\fitness_history.npy

      # 7️⃣ Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: EvoNet/package-lock.json

      # 8️⃣ Install dependencies (ci = reproducible, respects package-lock.json)
      - name: Install dependencies
        run: |
          cd EvoNet
          npm ci

      # 9️⃣ Build Electron installer & publish to GitHub Releases
      - name: Build & Publish
        shell: pwsh
        run: |
          cd EvoNet
          npm run build:win
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
